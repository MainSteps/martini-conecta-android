name: Funcionalidad
description: Tarea ligada a un indicador de la pauta
title: "[Feature] "
labels: []
body:
  - type: input
    id: ie
    attributes:
      label: IE de la pauta
      placeholder: "2.1.2 (15 %)"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptación
      placeholder: |
        - [ ] Criterio 1
        - [ ] Criterio 2
    validations:
      required: true
  - type: input
    id: dependencies
    attributes:
      label: Dependencias
      placeholder: "Ninguna"
