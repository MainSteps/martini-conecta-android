name: Android CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-37 build-tools;36.0.0

      - name: Compilar y probar
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon
